[project]
name = "agent-skills-installer"
version = "0.1.1"
description = "Copy agent skills from git repos into local directories for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jacob Brunson", email = "github@jacobbrunson.com" },
]
dependencies = [
    "typer>=0.9",
    "questionary>=2.0",
    "python-frontmatter>=1.1",
    "tomli-w>=1.0",
]

[project.scripts]
agent-skills-installer = "agent_skills_installer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_skills_installer"]
[dependency-groups]
dev = [
    "black>=25.0",
]
[tool.black]
target-version = ["py311"]
